name: proximity
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup:local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local}
      POSTGRES_DB: ${POSTGRES_DB:-proximity}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  postgres_data:
